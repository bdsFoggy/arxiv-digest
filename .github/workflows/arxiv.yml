name: Arxiv Daily Digest

on:
  push:
    branches: [main]
    paths:
      - 'arxiv_daily_digest_simple.py'
      - 'state_store.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/arxiv.yml'
  schedule:
    # Beijing/Singapore time 08:00 (UTC 00:00). GitHub may introduce scheduling delay.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'resume = send digest; preview = full fetch, no email; diagnose = one OAI page'
        type: choice
        default: resume
        options:
          - resume
          - preview
          - diagnose

permissions:
  contents: write

concurrency:
  group: arxiv-digest-global
  cancel-in-progress: false

jobs:
  run-script:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      DIGEST_STATE_PATH: digest-state.json
      DIGEST_OUTPUT_DIR: run-output
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test recovery and OAI metadata handling
        run: python -m unittest discover -s tests -v
      - name: Restore recovery checkpoint
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u state_store.py restore
      - name: Fetch digest or run diagnostic
        id: digest
        # Leave time for saving state even if a network call stalls.
        timeout-minutes: 12
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$RUN_MODE" = "diagnose" ]; then
            python -u arxiv_daily_digest_simple.py --diagnose
          elif [ "$RUN_MODE" = "preview" ]; then
            python -u arxiv_daily_digest_simple.py --dry-run
          elif [ "$RUN_EVENT" = "push" ]; then
            python -u arxiv_daily_digest_simple.py --source rss --dry-run --scheduled
          elif [ "$RUN_EVENT" = "schedule" ]; then
            python -u arxiv_daily_digest_simple.py --source rss --scheduled
          else
            python -u arxiv_daily_digest_simple.py
          fi
      - name: Save recovery checkpoint even after failure
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u state_store.py save
      - name: Upload diagnostic and recovery backup
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-output/
            digest-state.json
          if-no-files-found: warn
          retention-days: 30
